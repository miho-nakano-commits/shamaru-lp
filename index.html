<!doctype html>
<html lang="ja">
  <head>

  <body>
    <main class="lp" aria-label="NeoWork誉田 ランディングページ">
      <section class="visual-section visual-section--hero" aria-labelledby="hero-title">

          width="1534"
          height="2172"
          fetchpriority="high"
        />
        <a class="cta-hotspot cta-hotspot--hero" href="#seminar" aria-label="無料オンライン説明会を予約"></a>

      <section class="visual-section" aria-labelledby="needs-title">
        <h2 id="needs-title" class="sr-only">こんな方は、ぜひご参加ください</h2>

          width="1532"
          height="1516"
          loading="lazy"

        <h2 id="comic-title" class="sr-only">SNS・YouTube専門の就労継続支援B型を漫画でご紹介</h2>

          alt="就労継続支援B型 NeoWork誉田で、SNS投稿や動画編集の仕事を始めるまでを紹介する漫画。"
          width="1534"
          height="10710"
          loading="lazy"
        />
        <img
          class="comic-image-replacement comic-image-replacement--service"
          src="img/comic-service-screen-shamaru.png"
          alt=""
          aria-hidden="true"
          width="1378"
          height="1064"
        />
        <img
          class="comic-image-replacement comic-image-replacement--exterior"
          src="img/comic-facility-exterior-shamaru.png"
          alt=""
          aria-hidden="true"
          width="1348"
          height="1044"
        />
        <img
          class="comic-image-replacement comic-image-replacement--conversation"
          src="img/comic-facility-conversation-shamaru.png"
          alt=""
          aria-hidden="true"
          width="1626"
          height="1038"
        />
        <a class="cta-hotspot cta-hotspot--comic" href="#seminar" aria-label="無料オンライン説明会を予約"></a>

      <section class="visual-section" aria-labelledby="features-title">
        <h2 id="features-title" class="sr-only">シャマル誉田だけの5つの特徴</h2>
        <img
          src="img/section-04-features.png"

          width="1528"
          height="1780"

        />
        <img
          class="features-heading-replacement"
          src="img/features-heading-shamaru-honda.png"
          alt=""
          aria-hidden="true"
          width="2170"
          height="725"
        />
      </section>

      <section class="visual-section visual-section--skills" aria-labelledby="skills-title">
        <h2 id="skills-title" class="sr-only">シャマル誉田で学べるスキル</h2>

          alt="SNS・YouTube、デザイン、イラスト・漫画、動画撮影・編集、音楽の作詞・作曲を学べます。"
          width="1532"
          height="3306"
          loading="lazy"
        />
        <img
          class="skills-heading-replacement"
          src="img/skills-heading-shamaru-honda.png"
          alt=""
          aria-hidden="true"
          width="2169"
          height="725"
        />
        <a class="cta-hotspot cta-hotspot--skills" href="#seminar" aria-label="無料オンライン説明会を予約"></a>

      <section class="visual-section" aria-labelledby="voices-title">
        <h2 id="voices-title" class="sr-only">利用者様の声</h2>

      <section class="visual-section" aria-labelledby="faq-title">
        <h2 id="faq-title" class="sr-only">よくある質問</h2>

          src="img/section-07-faq.png"
          alt="障がい者手帳、利用条件、未経験、仕事内容、人間関係、在宅利用についてのよくある質問と回答。"
          width="1530"
          height="3098"
          loading="lazy"
        />

      <section id="seminar" class="visual-section visual-section--seminar" aria-labelledby="seminar-title">
        <h2 id="seminar-title" class="sr-only">無料オンライン説明会でお伝えする内容</h2>
        <img
          src="img/section-08-seminar.png"
          alt="無料オンライン説明会では、WEBスキル、就労継続支援B型、NeoWork誉田、利用者、他施設との違い、利用の流れ、スタッフ、工賃についてお伝えします。"

        <a
          class="cta-hotspot cta-hotspot--seminar"

          aria-label="無料オンライン説明会を予約"
        ></a>
